>

    content="Explore the Gospel of John with EOC Youth — uncover its stories, themes, teachings, and the message of Jesus from beginning to end."

    <!-- Google Fonts -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Main stylesheet -->
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         CINEMATIC BACKGROUND
         ===================================================== -->

    <div class="site-background"></div>


    <!-- =====================================================
         OUTER VIGNETTE
         ===================================================== -->

    <div class="site-vignette"></div>


    <!-- =====================================================
         MAIN FLOATING FRAME
         ===================================================== -->

    <main class="main-frame">


        <!-- =================================================
             INNER ATMOSPHERE
             ================================================= -->

        <div class="frame-overlay"></div>


        <!-- =================================================
             HEADER
             ================================================= -->

        <header class="site-header">


            <!-- Brand -->

            <div class="brand">
                EOC YOUTH
            </div>


            <!-- Decorative navigation -->

            <nav
                class="decorative-nav"
                aria-label="Decorative navigation"
            >

                <span>HOME</span>

                <span>BIBLE STUDY</span>

                <span>JOHN</span>

                <span>EOC YOUTH</span>

            </nav>


            <!-- Decorative menu icon -->

            <div
                class="menu-icon"
                aria-hidden="true"
            >

                <span></span>
                <span></span>
                <span></span>

            </div>


        </header>


        <!-- =================================================
             HERO
             ================================================= -->

        <section class="hero">


            <div class="hero-eyebrow">
                EOC YOUTH
            </div>


            <h1 class="hero-title">

                <span>GOSPEL OF</span>

                <span>JOHN</span>

            </h1>


            <div class="hero-subtitle">
                BIBLE STUDY
            </div>


            <!-- =================================================
                 CONTINUE BUTTON
                 ================================================= -->

            <a
                href="https://eocyouth.github.io/john-bible-study/"
                class="continue-button"
                id="continueButton"
            >
                <span>Continue</span>

                <span class="arrow">➤ </span>
            </a>


        </section>


        <!-- =================================================
             SCRIPTURE GLASS PANEL
             ================================================= -->

        <aside class="scripture-panel">


            <div class="scripture-reference">
                JOHN 1:1
            </div>


            <p class="scripture-text">
                In the beginning was the Word,
                and the Word was with God,
                and the Word was God.
            </p>


            <div class="scripture-translation">
                KJV
            </div>


        </aside>


        <!-- =================================================
             GOSPEL STATISTICS
             ================================================= -->

        <section
            class="gospel-statistics"
            aria-label="Gospel of John statistics"
        >


            <div class="stat">

                <div class="stat-number">
                    4
                </div>

                <div class="stat-label">
                    BOOK OF THE<br>
                    NEW TESTAMENT
                </div>

            </div>


            <div class="stat">

                <div class="stat-number">
                    21
                </div>

                <div class="stat-label">
                    CHAPTERS
                </div>

            </div>


            <div class="stat">

                <div class="stat-number">
                    879
                </div>

                <div class="stat-label">
                    VERSES
                </div>

            </div>


        </section>


        <!-- =================================================
             BOTTOM LEFT INFORMATION
             ================================================= -->

        <div class="bottom-information">

            <span>
                EOC YOUTH
            </span>

            <span>
                GOSPEL OF JOHN
            </span>

        </div>


        <!-- =================================================
             RIGHT VERTICAL INDICATOR
             ================================================= -->

        <div
            class="vertical-indicator"
            aria-hidden="true"
        >


            <span class="indicator-number">
                01
            </span>


            <div class="indicator-line">

                <div class="indicator-progress"></div>

            </div>


            <span class="indicator-number">
                04
            </span>


        </div>


    </main>


    <!-- =====================================================
         TELEMETRY / PAGE JAVASCRIPT
         ===================================================== -->

    <script src="script.js"></script>


</body>

</html>
